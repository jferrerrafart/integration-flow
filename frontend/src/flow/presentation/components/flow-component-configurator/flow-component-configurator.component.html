<app-component-selector
  [label]="role()"
  [components]="components()"
  [selected]="selectedComponent()"
  (componentSelected)="onComponentSelected($event)"
/>

@if (configuration(); as configuration) {
  <app-dynamic-configuration
    class="dynamic-configuration"
    [configuration]="configuration"
    [initialValue]="initialFormValue()"
    (valueChanged)="onConfigurationChanged($event)"
  />
}
