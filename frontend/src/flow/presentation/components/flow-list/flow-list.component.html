@if (flows().length === 0) {
  <p class="flow-list__empty">No flows created yet.</p>
} @else {
  <div class="flow-list__table-wrapper">
    <table mat-table [dataSource]="flows()" class="flow-list__table">
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let flow">{{ flow.id }}</td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let flow">{{ flow.name }}</td>
      </ng-container>

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef>Created</th>
        <td mat-cell *matCellDef="let flow">
          {{ flow.createdAt | date: "yyyy-MM-dd HH:mm" }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let flow" class="flow-list__actions">
          <button mat-button color="primary" (click)="onEdit(flow)">
            Edit
          </button>

          <button mat-button color="warn" (click)="onDelete(flow.id)">
            Delete
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
}
